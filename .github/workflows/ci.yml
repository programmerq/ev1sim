name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So the schedule-only work below can be run on demand.  Without this a red
  # cron can only be re-checked by waiting up to three days for the next one,
  # which is a poor property for a check whose whole job is to notice drift.
  workflow_dispatch:
  schedule:
    # Two jobs of work, both of which want a lane nobody waits on.
    #
    # 1. Keep the Chrono build cache warm.  Only chrono-smoke runs on this cron
    #    — every other job is gated with `if: github.event_name != 'schedule'`
    #    so the warm-up doesn't burn runner time on the cheap jobs.  A cache
    #    restore (even a hit) resets GitHub's 7-day idle-eviction timer, and a
    #    miss rebuilds it off the PR critical path so contributors never wait
    #    on a cold (~20-40 min) Chrono build.
    #
    # 2. Re-derive the measured settle table (2026-08-12).  Seven headless
    #    scenario runs, ~18 min measured locally and more on a runner.  It is
    #    here rather than on the PR path deliberately: adding that to a lane
    #    that gates every PR is the wrong direction for a repo that has been
    #    finding lanes running at zero headroom, and on a Chrono cache miss it
    #    could push the job past its ceiling — which would turn a correctness
    #    check into a flaky one.  Nobody waits on this lane, so 18 minutes
    #    costs nothing here.
    - cron: '17 6 */3 * *'

jobs:
  validate-configs:
    if: github.event_name != 'schedule'   # cron only warms chrono-smoke's cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON (config + level + vehicle data)
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          errs = 0
          for p in sorted(pathlib.Path('.').rglob('*.json')):
              if '.git' in p.parts or 'build' in p.parts or '_deps' in p.parts:
                  continue
              if 'deps' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  print(f'BAD {p}: {e}')
                  errs += 1
          if errs:
              print(f'{errs} invalid JSON file(s)')
              sys.exit(1)
          print('all JSON parses OK')
          PY

      - name: Validate scenario configs declare required fields
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          errs = 0
          for p in sorted(pathlib.Path('config').glob('*.json')):
              j = json.loads(p.read_text())
              # Headless runs must declare a termination condition so CI can't hang.
              sim = j.get('simulation', {})
              if sim.get('headless'):
                  has_max = sim.get('max_time_s', 0) > 0
                  has_scripted = j.get('scripted', {}).get('enabled', False)
                  # A scenario harness self-terminates when its steps complete
                  # (the ABS regression configs rely on this), so it counts as a
                  # valid termination condition too.
                  scen = j.get('scenario', {})
                  has_scenario = bool(scen.get('path')) or scen.get('enabled', False)
                  if not (has_max or has_scripted or has_scenario):
                      print(f'BAD {p}: headless requires max_time_s>0, scripted.enabled, or a scenario')
                      errs += 1
          sys.exit(1 if errs else 0)
          PY

  repo-hygiene:
    if: github.event_name != 'schedule'   # cron only warms chrono-smoke's cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>) ' -- ':!*.md'; then
            echo 'merge conflict markers found'
            exit 1
          fi

      - name: Reject trailing whitespace in source
        run: |
          if git grep -nE ' +$' -- 'src/*.cpp' 'src/*.h' 'tests/*.cpp'; then
            echo 'trailing whitespace in source files'
            exit 1
          fi

  # Chrono-free unit tests.  The ev1sim_tests target compiles no Chrono sources
  # (no VehicleWorld/SimApp), so it builds + runs without a (slow-to-build)
  # Chrono install via -DEV1SIM_TESTS_ONLY=ON — it only needs Irrlicht headers,
  # plus Catch2 + nlohmann/json (both fetched at configure time).  This catches
  # the connector endpoint-contract / PhysicalWorld regressions that previously
  # slipped through because nothing built the C++ in CI.
  #
  # The full sim app (Chrono) IS now built + smoke-tested by the chrono-smoke
  # job below (Chrono is built once and cached via actions/cache).  The ABS
  # integration gate (Chrono + electricsim) still remains out of CI; run it
  # locally via scripts/abs_regression.sh.
  unit-tests:
    if: github.event_name != 'schedule'   # cron only warms chrono-smoke's cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Irrlicht (Chrono-free test dep)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libirrlicht-dev

      - name: Configure (tests only — no Chrono)
        run: cmake -B build -S . -DEV1SIM_TESTS_ONLY=ON -DEV1SIM_HAVE_WHEEL_IO=OFF

      - name: Build unit tests
        run: cmake --build build --target ev1sim_tests -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # Integrated build: compile the connector with EV1SIM_HAVE_EXTERNAL_SIM=1
  # against a committed, self-contained electricsim I/O stub
  # (tests/electricsim_stub).  The unit-tests job builds the *stub* connector
  # (the `#else` branch); this one compiles the guarded transport/publish path
  # that branch `#if`-excludes — the class of breakage that let the main-harness
  # horn bug reach main.  No real electricsim checkout, no secret; still Chrono-
  # free.
  #
  # WHAT THIS JOB CANNOT SEE. The stub's ids are pinned to ELECTRICSIM's — the
  # manifest's `provenance` line names the exact upstream commit they were copied
  # from. So "has upstream moved since?" is a real question, and this job cannot
  # answer it: electricsim is a private repo and this workflow holds no credential
  # for it, by design. The stub check below therefore runs its INTEGRITY leg only
  # (the copy is what it claims to be), never its UPSTREAM leg (the copy is
  # current). A stub that is internally perfect and months behind passes here.
  #
  # The upstream leg needs both trees at once, which is the VAT nightly's
  # situation, not this one. Until it runs somewhere unattended, upstream drift is
  # found the way it was found last time: an integrated build against a real
  # checkout stops compiling.
  integrated-build:
    if: github.event_name != 'schedule'   # cron only warms chrono-smoke's cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Irrlicht
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libirrlicht-dev

      - name: Configure (tests-only + electricsim stub connector)
        run: |
          cmake -B build -S . \
            -DEV1SIM_TESTS_ONLY=ON \
            -DEV1SIM_HAVE_WHEEL_IO=OFF \
            -DELECTRICSIM_DIR="${GITHUB_WORKSPACE}/tests/electricsim_stub" 2>&1 | tee cmake-configure.log

      - name: Assert the electricsim connector was enabled
        # Guard against a false green: if the stub tree weren't picked up, the
        # build would silently fall back to the plain stub and skip the guarded path.
        run: |
          if grep -q "electricsim connector: not found" cmake-configure.log; then
            echo "::error::electricsim stub not picked up — integrated build fell back to stub mode"
            exit 1
          fi
          grep "electricsim connector:" cmake-configure.log

      # Fail fast and visibly if the vendored stub has been hand-edited or is
      # incomplete. ctest runs this too, but as its own step a drift failure names
      # itself in the job list instead of being one line inside a 500-test log.
      #
      # No external-sim tree exists here, so this is the INTEGRITY leg only: it
      # proves the copy is what it claims to be, not that the copy is current.
      # Staleness is caught by the same script with --upstream, wherever a real
      # tree is available.
      - name: Check vendored stub integrity
        run: tests/electricsim_stub/check_stub_sync.sh

      # The proof that the check above can fail. Without it a green stub check says
      # nothing — which is exactly how the previous static_assert drift guards
      # stayed green while 5 of the 15 vendored files rotted.
      - name: Prove the stub check can fail
        run: tests/electricsim_stub/selftest_check_stub_sync.sh

      - name: Build unit tests (EV1SIM_HAVE_EXTERNAL_SIM=1)
        run: cmake --build build --target ev1sim_tests -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # Real sim build + headless smoke gate.  Builds the Chrono-backed ev1sim
  # executable — src/SimApp.cpp (2,500+ lines) and src/VehicleWorld.cpp, which
  # the jobs above never compile (they build the Chrono-free test target via
  # -DEV1SIM_TESTS_ONLY=ON) — and runs it headless as a merge gate, so compile
  # breaks and runtime regressions in the largest source files can no longer
  # reach main unseen.
  #
  # Project Chrono (Vehicle + Irrlicht) is built from source on a cache miss
  # (~20-40 min cold) and restored from actions/cache on a hit (then only
  # ev1sim compiles, ~2-5 min).  Headless mode creates no Irrlicht/OpenGL device
  # (SimApp skips SetupVisualization), so no X/display server is needed at run
  # time even though the Irrlicht library is linked.
  #
  # Future option (deferred): bake Chrono into a prebuilt image on GHCR and use
  # `container:` here for zero cold-build variance — see scripts/build_chrono.sh.
  chrono-smoke:
    runs-on: ubuntu-latest
    # Absolute ceiling.  Sized for the worst case this job can hit: a cold
    # Chrono build (~20-40 min) plus, on the schedule event only, the settle
    # table re-derivation (~18 min locally, budgeted 45 below).  Raised from 75
    # on 2026-08-12 when that step was added.  It costs nothing on a PR run —
    # a ceiling is not a reservation — and it exists so a slow cron cannot be
    # killed halfway and leave a log that reads like a clean one.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v6

      - name: Install Chrono build deps (Vehicle + Irrlicht + GL/X11)
        # The list lives in scripts/build_chrono.sh next to the preflight that
        # checks it, so this job and a local developer install the same thing.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $(scripts/build_chrono.sh --print-deps)

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ccache-chrono-smoke-${{ runner.os }}
          max-size: 2G

      - name: Restore prebuilt Chrono install
        id: chrono-cache
        uses: actions/cache@v5
        with:
          path: ~/chrono-install
          # The recipe (ref + flags) lives in scripts/build_chrono.sh, so
          # hashing it rotates the cache key whenever the recipe changes.
          key: chrono-${{ runner.os }}-release-9.0-${{ hashFiles('scripts/build_chrono.sh') }}
          restore-keys: |
            chrono-${{ runner.os }}-release-9.0-

      - name: Build + install Chrono (cache miss only)
        if: steps.chrono-cache.outputs.cache-hit != 'true'
        run: scripts/build_chrono.sh "$HOME/chrono-install"

      # ev1sim reads the Chrono install and writes nothing into it.  Dropping
      # every write bit here makes that a build failure the moment it stops
      # being true, rather than a machine-specific surprise: configure used to
      # copy data/vehicle/ev1 into the install, so one build as another user
      # left files nobody else could overwrite and every later build died.
      # Read-only is also what the cache upload needs — it only reads the tree.
      - name: Drop write permission on the Chrono install
        run: chmod -R a-w "$HOME/chrono-install"

      - name: Configure ev1sim against Chrono
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DChrono_DIR="$HOME/chrono-install/lib/cmake/Chrono" \
            -DEV1SIM_HAVE_WHEEL_IO=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        # No -DEV1SIM_TESTS_ONLY ⇒ find_package(Chrono REQUIRED) makes a missing
        # Chrono a hard configure failure (no silent false-green); the explicit
        # --target ev1sim below errors if the app target were skipped.  No
        # -DELECTRICSIM_DIR ⇒ the external-sim connector stays off, so the smoke
        # run takes the no-bus headless path.

      # Reconfiguring a build directory against a different Chrono_DIR must not
      # leave the previous install's model names in the vehicle data root — the
      # sim would keep loading e.g. hmmwv/ out of a prefix this build no longer
      # uses.  Planting a name the configured Chrono does not provide tests that
      # in seconds, with no second Chrono install to build: the next configure
      # has to take it away again.
      - name: Vehicle data root carries only what the configured Chrono has
        run: |
          ln -s /nonexistent build/chrono-vehicle-data/model_from_another_prefix
          cmake -B build -S . -DChrono_DIR="$HOME/chrono-install/lib/cmake/Chrono"
          if [ -L build/chrono-vehicle-data/model_from_another_prefix ]; then
            echo "::error::stale model name survived reconfigure"; exit 1
          fi
          [ -L build/chrono-vehicle-data/ev1 ] || { echo "::error::ev1 link missing"; exit 1; }

      - name: Build the ev1sim executable
        run: cmake --build build --target ev1sim -j"$(nproc)"

      - name: Smoke — headless_smoke.json must exit 0
        timeout-minutes: 3
        run: ./build/ev1sim --config config/headless_smoke.json

      - name: Smoke — accel_brake.json must exit 0 (scripted accel/hold/brake)
        timeout-minutes: 3
        run: ./build/ev1sim --config config/accel_brake.json

      # Bonus: compile + run the unit-test target against the REAL Chrono.  The
      # tests-only jobs above link ev1sim_tests against Irrlicht directly; this
      # exercises the Chrono link path (CMakeLists.txt: ${CHRONO_LIBRARIES})
      # that nothing else in CI builds.  Reuses the Chrono built above.
      - name: Build + run unit tests against full Chrono
        run: |
          cmake -B build-tests -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DChrono_DIR="$HOME/chrono-install/lib/cmake/Chrono" \
            -DEV1SIM_HAVE_WHEEL_IO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-tests --target ev1sim_tests -j"$(nproc)"
          ctest --test-dir build-tests --output-on-failure

      # ── Settle-table re-derivation (cron / manual only) ──────────────────
      # config/scenarios/measured_settle.json records when each ABS scenario's
      # wait_for_speed barrier actually releases.  tests/test_scenario.cpp's
      # [Runway] cases check each brake against those numbers and CANNOT see
      # the plant move under them: a barrier that starts releasing a second
      # later leaves a brake still clearing release + settle on paper while the
      # real settle has halved.  This re-derives every measured field from an
      # actual run and fails when one has drifted past 0.05 s.
      #
      # NOT on the PR path, deliberately — see the comment on `schedule:` at
      # the top of this file.  It needs only ./build/ev1sim, built above, and
      # no electricsim.
      #
      # RUNTIME: seven headless scenarios, ~18 min measured locally (the
      # slowest, abs_hard_brake, is ~2.5 min).  Budgeted 45 to leave room for a
      # slower runner without the budget itself becoming the thing that fails.
      # An explicit step timeout matters here beyond politeness: killed
      # partway, the log ends after some number of green per-scenario blocks
      # and otherwise reads like a clean run, so the script prints a
      # completion marker and the step below refuses to pass without it.
      - name: Re-derive the measured settle table
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        run: |
          set -o pipefail
          rc=0
          python3 scripts/scenario_runway_report.py --binary ./build/ev1sim \
            2>&1 | tee runway.log || rc=$?

          # Completion marker, not just the exit code: a timeout kill also
          # gives a non-zero rc, and this distinguishes "ran and disagreed"
          # from "was cut off".
          if ! grep -q '^\[runway\] re-derived' runway.log; then
            echo "::error title=Settle table re-derivation did not finish::No completion marker in the log — the run was cut off (timeout, crash, or OOM) rather than reaching a verdict. Nothing has been checked."
            {
              echo "## Settle table: **did not finish**"
              echo
              echo "The re-derivation was cut off before reaching a verdict, so"
              echo "the table has *not* been checked this run."
              echo
              echo '```'
              tail -30 runway.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error title=Measured settle table is stale::A re-derived barrier release or surface crossing disagrees with config/scenarios/measured_settle.json by more than the tolerance the table carries. Re-measure with 'scripts/scenario_runway_report.py --update' and commit what moved, saying why the plant moved."
            {
              echo "## Settle table: **stale**"
              echo
              echo "A re-derived value disagrees with"
              echo "\`config/scenarios/measured_settle.json\`. Fix with:"
              echo
              echo '```sh'
              echo 'scripts/scenario_runway_report.py --update   # then commit what moved'
              echo '```'
              echo
              grep -E 'STALE TABLE|^=== ' runway.log || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

          {
            echo "## Settle table: agrees"
            echo
            grep -E '^\[runway\] re-derived' runway.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the re-derivation log
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: runway-report
          path: runway.log
          if-no-files-found: ignore
          retention-days: 30
